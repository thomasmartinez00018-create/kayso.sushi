
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      META DOMAIN VERIFICATION
      Para activar:
      1. Events Manager → Brand Safety → Domains → Add Domain → kaysosushi.store
      2. Meta te da un código tipo "abc123def456..."
      3. Reemplazá el "PENDIENTE_REEMPLAZAR" abajo con ese código
      4. Commit + deploy
      5. Volvé a Events Manager y tocá "Verify Domain"
    -->
    <meta name="facebook-domain-verification" content="xmkz2zgpxkgn82gtpsea3uyuxj1bmn" />

    <title>Kayso Sushi | El Mejor Sushi en San Miguel</title>
    <meta name="description" content="Sushi delivery en San Miguel, Muñiz y Bella Vista. Armá tu combo y pedí por WhatsApp: rolls, combinados y sushi burgers. Retiro y delivery propio." />

    <!-- Open Graph / Meta Ads -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:url" content="https://www.kaysosushi.store/" />
    <meta property="og:title" content="Kayso Sushi | Pedí tu Sushi por WhatsApp en San Miguel" />
    <meta property="og:description" content="Combos desde $17.500 · 15 piezas. Armá tu combo y pedí directo por WhatsApp. Delivery propio en San Miguel, Muñiz y Bella Vista." />
    <meta property="og:image" content="https://www.kaysosushi.store/img/hero-wide.jpg" />
    <meta property="og:image:width" content="1080" />
    <meta property="og:image:height" content="480" />
    <meta property="og:site_name" content="Kayso Sushi" />

    <!-- Canonical -->
    <link rel="canonical" href="https://www.kaysosushi.store/" />

    <!-- Structured data: 2 sucursales con horarios reales (Gladys, 2-jul-2026). Sin aggregateRating hasta tener reseñas reales. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Restaurant",
      "name": "Kayso Sushi",
      "url": "https://www.kaysosushi.store/",
      "servesCuisine": ["Sushi", "Japonesa"],
      "priceRange": "$$",
      "image": "https://i.postimg.cc/bvS81MjF/Diseno-sin-titulo.png",
      "telephone": "+54 9 11 2862-7514",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Av. Pte. Perón 1991",
        "addressLocality": "San Miguel",
        "addressRegion": "Buenos Aires",
        "addressCountry": "AR"
      },
      "openingHoursSpecification": [
        { "@type": "OpeningHoursSpecification", "dayOfWeek": ["Tuesday","Wednesday","Thursday","Friday","Saturday"], "opens": "11:30", "closes": "14:30" },
        { "@type": "OpeningHoursSpecification", "dayOfWeek": ["Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"], "opens": "18:30", "closes": "22:30" }
      ],
      "department": {
        "@type": "Restaurant",
        "name": "Kayso Sushi Gelly y Obes",
        "telephone": "+54 9 11 5053-8254",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Gelly y Obes 2308",
          "addressLocality": "San Miguel",
          "addressRegion": "Buenos Aires",
          "addressCountry": "AR"
        },
        "openingHoursSpecification": [
          { "@type": "OpeningHoursSpecification", "dayOfWeek": ["Wednesday","Thursday","Friday","Saturday","Sunday"], "opens": "18:00", "closes": "22:30" }
        ]
      }
    }
    </script>

    <!-- Favicon (local, 32px: antes era un PNG de 101 KB servido desde postimg) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Meta Pixel Code (Script part stays in Head) -->
    <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    // Advanced matching: ID de visitante estable + zona. El mismo ID viaja por CAPI (trackingService),
    // así la copia del navegador y la del servidor llevan los mismos datos de coincidencia.
    var kvid; try { kvid = localStorage.getItem('_kayso_vid'); if (!kvid) { kvid = 'v' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); localStorage.setItem('_kayso_vid', kvid); } } catch (e) {}
    var kam = { ct: 'sanmiguel', st: 'buenosaires', country: 'ar' };
    if (kvid) kam.external_id = kvid;
    fbq('init', '866675959278129', kam);
    fbq('track', 'PageView');
    </script>
    <!-- End Meta Pixel Code Part 1 -->

    <!-- Precarga del hero (local). En mobile pesa 10 KB; antes eran 1200px de Unsplash. -->
    <link rel="preload" as="image" href="/img/hero-portrait.webp" media="(max-width: 767px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/img/hero-wide.webp" media="(min-width: 768px)" fetchpriority="high" />

    <!-- Las fotos del menú viven en postimg; el resto de los dominios externos ya no se usa. -->
    <link rel="preconnect" href="https://i.postimg.cc" />
    <link rel="dns-prefetch" href="https://i.postimg.cc" />
  </head>
  <body class="bg-kayso-dark text-white">
    <!-- Meta Pixel Code Part 2 (Noscript goes here in body) -->
    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=866675959278129&ev=PageView&noscript=1"
    /></noscript>
    
    <div id="root"></div>
    
    <!-- Punto de entrada para el build local -->
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
